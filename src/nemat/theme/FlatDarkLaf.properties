# =============================================================
# Abdolhashem Management System - Premium Dark Theme
# =============================================================

@background=#0B1220
@foreground=#F8FAFC

# Main surfaces
Panel.background=@background
RootPane.background=@background
Viewport.background=@background
ScrollPane.background=@background

# Sidebar
Menu.background=#0F1B33
Menu.foreground=#F8FAFC
Menu.lineColor=#223454
Menu.arrowColor=#7DD3FC
Menu.lightdark.background=#142544
Menu.lightdark.button.background=#1B3157
Menu.title.foreground=#94A3B8
Menu.button.background=#0F1B33
Menu.button.selectedBackground=#2563EB
Menu.button.selectedForeground=#FFFFFF
Menu.button.hoverBackground=#172A4A
Menu.button.hoverForeground=#FFFFFF

# Sidebar scrollbar
Menu.ScrollBar.background=#0F1B33
Menu.ScrollBar.thumb=#2A4168

# Login / forms
Login.background=#0B1220

# Text fields
TextField.background=#111E35
TextField.foreground=#F8FAFC
TextField.placeholderForeground=#71829D
TextField.borderColor=#2A4168
TextField.focusedBorderColor=#4F7CFF
TextField.disabledBackground=#0D1729

ComboBox.background=#111E35
ComboBox.foreground=#F8FAFC
ComboBox.borderColor=#2A4168
ComboBox.focusedBorderColor=#4F7CFF

PasswordField.background=#111E35
PasswordField.foreground=#F8FAFC
PasswordField.borderColor=#2A4168
PasswordField.focusedBorderColor=#4F7CFF

# Buttons
Button.background=#2563EB
Button.foreground=#FFFFFF
Button.hoverBackground=#3B82F6
Button.pressedBackground=#1D4ED8
Button.focusedBorderColor=#60A5FA

# Tables
Table.background=#0F1B33
Table.foreground=#E5E7EB
Table.selectionBackground=#2563EB
Table.selectionForeground=#FFFFFF
Table.gridColor=#1E3150
TableHeader.background=#142544
TableHeader.foreground=#F8FAFC

# Separators / borders
Separator.foreground=#223454

# Toasts
Toast.success.outlineColor=#22C55E
Toast.info.outlineColor=#38BDF8
Toast.warning.outlineColor=#F59E0B
Toast.error.outlineColor=#F43F5E

# Accent palette
App.accent.default=#4F7CFF
App.accent.blue=#38BDF8
App.accent.purple=#8B5CF6
App.accent.red=#F43F5E
App.accent.orange=#F59E0B
App.accent.yellow=#FBBF24
App.accent.green=#22C55E
