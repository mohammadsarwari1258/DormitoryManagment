@accentColor=$App.accent.default

# Typography
h1.font=bold +12
h2.font=bold +5
h3.font=bold +2

# Clean modern controls
Component.focusWidth=1
Component.arc=10
Button.arc=10
Button.margin=5,12,5,12
TextComponent.arc=9
TextField.margin=6,10,6,10
PasswordField.margin=6,10,6,10
ComboBox.padding=5,9,5,9

# Menu typography and scrolling
Menu.header.font=bold +2
Menu.label.font=+0
Menu.scroll.width=5
Menu.scroll.trackInsets=2,0,2,1
Menu.scroll.thumbInsets=$Menu.scroll.trackInsets
Menu.icon.lightColor=#F8FAFC
Menu.icon.darkColor=#F8FAFC

# Smooth scrolling
ScrollBar.trackArc=999
ScrollBar.thumbArc=999
ScrollBar.width=7

Popup.dropShadowInsets=2,5,8,8
Toast.background=lighten(@background,5%)

AccentControl.show=false
